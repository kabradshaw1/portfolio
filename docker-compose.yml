services:
  qdrant:
    image: qdrant/qdrant:v1.16.3
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ingestion
      - chat
      - debug
      - eval
    restart: unless-stopped

  ingestion:
    image: ghcr.io/kabradshaw1/portfolio/ingestion:latest
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    env_file: .env
    depends_on:
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  chat:
    image: ghcr.io/kabradshaw1/portfolio/chat:latest
    build:
      context: ./services
      dockerfile: chat/Dockerfile
    env_file: .env
    environment:
      - CHAT_RATE_LIMIT_ASK_OPERATOR=${CHAT_RATE_LIMIT_ASK_OPERATOR:-60/minute}
      - CHAT_RATE_LIMIT_ASK_USER=${CHAT_RATE_LIMIT_ASK_USER:-20/minute}
      - CHAT_RATE_LIMIT_ASK_ANONYMOUS=${CHAT_RATE_LIMIT_ASK_ANONYMOUS:-5/minute}
      - CHAT_RATE_LIMIT_ASK_INTERNAL_EVAL=${CHAT_RATE_LIMIT_ASK_INTERNAL_EVAL:-60/minute}
      - CHAT_RATE_LIMIT_SEARCH_OPERATOR=${CHAT_RATE_LIMIT_SEARCH_OPERATOR:-120/minute}
      - CHAT_RATE_LIMIT_SEARCH_USER=${CHAT_RATE_LIMIT_SEARCH_USER:-30/minute}
      - CHAT_RATE_LIMIT_SEARCH_ANONYMOUS=${CHAT_RATE_LIMIT_SEARCH_ANONYMOUS:-10/minute}
      - CHAT_RATE_LIMIT_SEARCH_INTERNAL_EVAL=${CHAT_RATE_LIMIT_SEARCH_INTERNAL_EVAL:-120/minute}
      - RAG_INTERNAL_EVAL_TOKEN=${RAG_INTERNAL_EVAL_TOKEN:-}
      - OLLAMA_GENERATE_MAX_IN_FLIGHT=${OLLAMA_GENERATE_MAX_IN_FLIGHT:-2}
      - OLLAMA_EMBED_MAX_IN_FLIGHT=${OLLAMA_EMBED_MAX_IN_FLIGHT:-4}
      - RERANK_MAX_IN_FLIGHT=${RERANK_MAX_IN_FLIGHT:-2}
      - OLLAMA_ADMISSION_QUEUE_TIMEOUT=${OLLAMA_ADMISSION_QUEUE_TIMEOUT:-5.0}
    depends_on:
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  debug:
    image: ghcr.io/kabradshaw1/portfolio/debug:latest
    build:
      context: ./services
      dockerfile: debug/Dockerfile
    env_file: .env
    depends_on:
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  eval:
    image: ghcr.io/kabradshaw1/portfolio/eval:latest
    build:
      context: ./services
      dockerfile: eval/Dockerfile
    env_file: .env
    environment:
      - JWT_SECRET=${JWT_SECRET}
      - EVAL_RATE_LIMIT_RUN_CREATE_OPERATOR=${EVAL_RATE_LIMIT_RUN_CREATE_OPERATOR:-20/minute}
      - EVAL_RATE_LIMIT_RUN_CREATE_USER=${EVAL_RATE_LIMIT_RUN_CREATE_USER:-5/minute}
      - EVAL_RATE_LIMIT_RUN_CREATE_ANONYMOUS=${EVAL_RATE_LIMIT_RUN_CREATE_ANONYMOUS:-0/minute}
      - EVAL_RATE_LIMIT_READ_OPERATOR=${EVAL_RATE_LIMIT_READ_OPERATOR:-240/minute}
      - EVAL_RATE_LIMIT_READ_USER=${EVAL_RATE_LIMIT_READ_USER:-30/minute}
      - EVAL_RATE_LIMIT_READ_ANONYMOUS=${EVAL_RATE_LIMIT_READ_ANONYMOUS:-10/minute}
      - EVAL_RATE_LIMIT_WRITE_OPERATOR=${EVAL_RATE_LIMIT_WRITE_OPERATOR:-30/minute}
      - EVAL_RATE_LIMIT_WRITE_USER=${EVAL_RATE_LIMIT_WRITE_USER:-10/minute}
      - EVAL_RATE_LIMIT_WRITE_ANONYMOUS=${EVAL_RATE_LIMIT_WRITE_ANONYMOUS:-0/minute}
      - RAG_INTERNAL_EVAL_TOKEN=${RAG_INTERNAL_EVAL_TOKEN:-}
      - OLLAMA_GENERATE_MAX_IN_FLIGHT=${OLLAMA_GENERATE_MAX_IN_FLIGHT:-2}
      - OLLAMA_ADMISSION_QUEUE_TIMEOUT=${OLLAMA_ADMISSION_QUEUE_TIMEOUT:-5.0}
    volumes:
      - eval_data:/app/data
    depends_on:
      chat:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      # Anonymous access is dev-only — disabled in K8s production via ConfigMap
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_ROOT_URL=https://grafana.kylebradshaw.dev
    depends_on:
      - prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - //var/run/docker.sock:/var/run/docker.sock:ro
    privileged: true
    restart: unless-stopped

  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.4.1
    ports:
      - "127.0.0.1:9835:9835"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  qdrant_data:
  eval_data:
  prometheus_data:
  grafana_data:
