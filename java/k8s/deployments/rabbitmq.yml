apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: java-tasks
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      initContainers:
        - name: render-definitions
          image: busybox:1.36
          # Inject the story password (from java-secrets) into the committed
          # template. '|' is the sed delimiter, so rabbit-story-password must
          # not contain a literal '|'. \$ keeps the token literal for matching;
          # $STORY_RABBIT_PASSWORD expands to the real value.
          command:
            - sh
            - -c
            - 'sed "s|\${STORY_RABBIT_PASSWORD}|$STORY_RABBIT_PASSWORD|" /templates/definitions.json.tmpl > /rendered/definitions.json'
          env:
            - name: STORY_RABBIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: java-secrets
                  key: rabbit-story-password
          volumeMounts:
            - name: definitions
              mountPath: /templates/definitions.json.tmpl
              subPath: definitions.json.tmpl
              readOnly: true
            - name: rendered-definitions
              mountPath: /rendered
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: "guest"
            - name: RABBITMQ_DEFAULT_PASS
              value: "guest"
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
            - name: prometheus
              containerPort: 15692
          volumeMounts:
            - name: rendered-definitions
              mountPath: /etc/rabbitmq/definitions.json
              subPath: definitions.json
              readOnly: true
            - name: definitions
              mountPath: /etc/rabbitmq/conf.d/20-definitions.conf
              subPath: rabbitmq.conf
            - name: definitions
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: definitions
          configMap:
            name: rabbitmq-definitions
        - name: rendered-definitions
          emptyDir: {}
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: rabbitmq-data
