apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-config
  namespace: ai-services
data:
  OLLAMA_BASE_URL: http://ollama:11434
  LLM_BASE_URL: http://ollama:11434
  EMBEDDING_BASE_URL: http://ollama:11434
  CHAT_MODEL: qwen2.5:14b
  EMBEDDING_MODEL: nomic-embed-text
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  COLLECTION_NAME: documents
  ALLOWED_ORIGINS: http://localhost:3000,https://kylebradshaw.dev
  # Retrieval tuning — number of chunks pulled from Qdrant per /chat call.
  TOP_K: "5"
  # Selects which template in app.prompt.PROMPTS is used; validated at startup.
  PROMPT_VERSION: v1-baseline
  CHAT_RATE_LIMIT_ASK_OPERATOR: 60/minute
  CHAT_RATE_LIMIT_ASK_USER: 20/minute
  CHAT_RATE_LIMIT_ASK_ANONYMOUS: 5/minute
  CHAT_RATE_LIMIT_ASK_INTERNAL_EVAL: 60/minute
  CHAT_RATE_LIMIT_SEARCH_OPERATOR: 120/minute
  CHAT_RATE_LIMIT_SEARCH_USER: 30/minute
  CHAT_RATE_LIMIT_SEARCH_ANONYMOUS: 10/minute
  CHAT_RATE_LIMIT_SEARCH_INTERNAL_EVAL: 120/minute
  OLLAMA_GENERATE_MAX_IN_FLIGHT: "2"
  OLLAMA_EMBED_MAX_IN_FLIGHT: "4"
  RERANK_MAX_IN_FLIGHT: "2"
  OLLAMA_ADMISSION_QUEUE_TIMEOUT: "5.0"
