apiVersion: v1
kind: ConfigMap
metadata:
  name: eval-config
  namespace: ai-services
data:
  CHAT_SERVICE_URL: http://chat:8000
  # Used by capture_run_config to snapshot the per-collection chunk params
  # at evaluation start. Same-namespace DNS — works in both prod and QA.
  INGESTION_SERVICE_URL: http://ingestion:8000
  LLM_PROVIDER: ollama
  LLM_BASE_URL: http://ollama:11434
  LLM_MODEL: qwen2.5:14b
  DB_PATH: /app/data/eval.db
  ALLOWED_ORIGINS: http://localhost:3000,https://kylebradshaw.dev,https://qa.kylebradshaw.dev
  EVAL_RATE_LIMIT_RUN_CREATE_OPERATOR: 20/minute
  EVAL_RATE_LIMIT_RUN_CREATE_USER: 5/minute
  EVAL_RATE_LIMIT_RUN_CREATE_ANONYMOUS: 0/minute
  EVAL_RATE_LIMIT_READ_OPERATOR: 240/minute
  EVAL_RATE_LIMIT_READ_USER: 30/minute
  EVAL_RATE_LIMIT_READ_ANONYMOUS: 10/minute
  EVAL_RATE_LIMIT_WRITE_OPERATOR: 30/minute
  EVAL_RATE_LIMIT_WRITE_USER: 10/minute
  EVAL_RATE_LIMIT_WRITE_ANONYMOUS: 0/minute
  EVAL_ITEM_QUEUE: eval.item.requested
  EVAL_ITEM_DLQ: eval.item.requested.dlq
  EVAL_WORKER_PREFETCH: "2"
  EVAL_WORKER_CONCURRENCY: "2"
  EVAL_ITEM_MAX_ATTEMPTS: "3"
  EVAL_ITEM_LEASE_SECONDS: "300.0"
  EVAL_STALE_ITEM_SECONDS: "900.0"
  OLLAMA_GENERATE_MAX_IN_FLIGHT: "2"
  OLLAMA_ADMISSION_QUEUE_TIMEOUT: "5.0"
