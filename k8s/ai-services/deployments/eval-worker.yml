apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-worker
  namespace: ai-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eval-worker
  template:
    metadata:
      labels:
        app: eval-worker
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: eval-worker
          image: ghcr.io/kabradshaw1/portfolio/eval:latest
          command: ["python", "-m", "app.worker"]
          envFrom:
            - configMapRef:
                name: eval-config
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: eval-rabbitmq
                  key: url
                  optional: false
          volumeMounts:
            - name: eval-data
              mountPath: /app/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: eval-data
          persistentVolumeClaim:
            claimName: eval-data
