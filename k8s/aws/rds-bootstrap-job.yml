# RDS bootstrap — AWS only.
#
# Terraform creates a single RDS instance whose master database is `taskdb`,
# owned by the master user `postgres`. The application expects a dedicated
# login role `taskuser` plus one database per service. On the self-hosted
# Postgres these were created by docker-entrypoint-initdb.d scripts
# (java/k8s/configmaps/postgres-initdb.yml), which RDS does not run.
#
# This Job runs inside the cluster (RDS lives in private subnets, unreachable
# from the Terraform runner) and connects as the master user to create the
# role, the databases, and the pg_stat_statements extension. It is idempotent
# and safe to re-run on every deploy. Connection details come from the
# rds-bootstrap Secret, which the deploy workflow creates from CI secrets.
apiVersion: batch/v1
kind: Job
metadata:
  name: rds-bootstrap
  namespace: go-ecommerce
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: rds-bootstrap
    spec:
      restartPolicy: Never
      containers:
        - name: bootstrap
          image: postgres:17-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD="$MASTER_PASSWORD"
              PSQL="psql -h $RDS_HOST -U $MASTER_USER -v ON_ERROR_STOP=1 -w"

              echo "==> Ensuring login role $APP_USER"
              if [ "$($PSQL -d postgres -tAc "SELECT 1 FROM pg_roles WHERE rolname='$APP_USER'")" = "1" ]; then
                $PSQL -d postgres -c "ALTER ROLE \"$APP_USER\" WITH LOGIN PASSWORD '$APP_PASSWORD'"
              else
                $PSQL -d postgres -c "CREATE ROLE \"$APP_USER\" WITH LOGIN PASSWORD '$APP_PASSWORD'"
              fi

              for db in taskdb authdb orderdb productdb cartdb paymentdb ecommercedb projectordb; do
                if [ "$($PSQL -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$db'")" != "1" ]; then
                  echo "==> Creating database $db"
                  $PSQL -d postgres -c "CREATE DATABASE \"$db\" OWNER \"$APP_USER\""
                fi
                # taskdb is created by RDS owned by the master user; re-own it.
                $PSQL -d postgres -c "ALTER DATABASE \"$db\" OWNER TO \"$APP_USER\""
                $PSQL -d "$db" -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements"
              done

              echo "==> RDS bootstrap complete"
          env:
            - name: RDS_HOST
              valueFrom:
                secretKeyRef:
                  name: rds-bootstrap
                  key: RDS_HOST
            - name: MASTER_USER
              valueFrom:
                secretKeyRef:
                  name: rds-bootstrap
                  key: MASTER_USER
            - name: MASTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rds-bootstrap
                  key: MASTER_PASSWORD
            - name: APP_USER
              valueFrom:
                secretKeyRef:
                  name: rds-bootstrap
                  key: APP_USER
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rds-bootstrap
                  key: APP_PASSWORD
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: tmp
          emptyDir: {}
