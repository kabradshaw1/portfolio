          value: "postgres://taskuser:$(TASK_DB_PASSWORD)@${RDS_ENDPOINT}:5432/orderdb?sslmode=verify-full&sslrootcert=/etc/rds/global-bundle.pem&application_name=order-service-migrate"
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: rds-ca
            configMap:
              name: rds-ca-bundle
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: rds-ca
            mountPath: /etc/rds
            readOnly: true
  - target:
      group: batch
      version: v1
      kind: Job
      name: go-product-migrate
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/0
        value:
          name: TASK_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: task-db-password
              key: password
      - op: replace
        path: /spec/template/spec/containers/0/env/1
        value:
          name: DATABASE_URL
          value: "postgres://taskuser:$(TASK_DB_PASSWORD)@${RDS_ENDPOINT}:5432/productdb?sslmode=verify-full&sslrootcert=/etc/rds/global-bundle.pem&application_name=product-service-migrate"
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: rds-ca
            configMap:
              name: rds-ca-bundle
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: rds-ca
            mountPath: /etc/rds
            readOnly: true
  - target:
      group: batch
      version: v1
      kind: Job
      name: go-payment-migrate
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/0
        value:
          name: TASK_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: task-db-password
              key: password
      - op: replace
        path: /spec/template/spec/containers/0/env/1
        value:
          name: DATABASE_URL
          value: "postgres://taskuser:$(TASK_DB_PASSWORD)@${RDS_ENDPOINT}:5432/paymentdb?sslmode=verify-full&sslrootcert=/etc/rds/global-bundle.pem&application_name=payment-service-migrate"
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: rds-ca
