              value: "postgres://taskuser:$(TASK_DB_PASSWORD)@${RDS_ENDPOINT}:5432/productdb?sslmode=verify-full&sslrootcert=/etc/rds/global-bundle.pem&application_name=product-service"
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds
              readOnly: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-payment-service
  namespace: go-ecommerce
spec:
  template:
    spec:
      volumes:
        - name: rds-ca
          configMap:
            name: rds-ca-bundle
      containers:
        - name: go-payment-service
          env:
            - name: TASK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-db-password
                  key: password
            - name: DATABASE_URL
              value: "postgres://taskuser:$(TASK_DB_PASSWORD)@${RDS_ENDPOINT}:5432/paymentdb?sslmode=verify-full&sslrootcert=/etc/rds/global-bundle.pem&application_name=payment-service"
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds
              readOnly: true

# --- Discrete-style deployments: mount the RDS CA (creds come from the
# cart-service-db / order-projector-db Secrets the workflow recreates). ---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-cart-service
  namespace: go-ecommerce
spec:
  template:
    spec:
      volumes:
        - name: rds-ca
          configMap:
            name: rds-ca-bundle
      containers:
        - name: go-cart-service
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds
              readOnly: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-order-projector
  namespace: go-ecommerce
spec:
  template:
    spec:
      volumes:
        - name: rds-ca
          configMap:
            name: rds-ca-bundle
      containers:
        - name: go-order-projector
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds
              readOnly: true

# --- Discrete-style migration Jobs: mount the RDS CA so the shell-assembled
# verify-full DSN can find sslrootcert. (DSN-style migration Jobs are patched
# via inline JSON6902 in kustomization.yaml — they need DATABASE_URL replaced,
# not merged.) ---
---
apiVersion: batch/v1
kind: Job
metadata:
  name: go-cart-migrate
  namespace: go-ecommerce
spec:
  template:
    spec:
      volumes:
        - name: rds-ca
          configMap:
            name: rds-ca-bundle
      containers:
        - name: migrate
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds
              readOnly: true
---
apiVersion: batch/v1
kind: Job
metadata:
  name: go-projector-migrate
  namespace: go-ecommerce
spec:
  template:
    spec:
      volumes:
        - name: rds-ca
          configMap:
            name: rds-ca-bundle
      containers:
        - name: migrate
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds
              readOnly: true
