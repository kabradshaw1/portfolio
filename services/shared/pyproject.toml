[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-providers"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.0",
    "anthropic>=0.30",
    "qdrant-client==1.17.1",
    "fastembed==0.8.0",
    "pillow==12.2.0",
]

[tool.setuptools.packages.find]
include = ["llm*", "rag*"]
